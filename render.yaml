services:
  - type: web
    name: quizbloom
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_NAME
        value: QuizBloom
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: quizbloom-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: quizbloom-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: quizbloom-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: quizbloom-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: quizbloom-db
          property: password
      - key: APP_URL
        value: https://quizbloom.onrender.com

databases:
  - name: quizbloom-db
    databaseName: quiz_system
    plan: free
